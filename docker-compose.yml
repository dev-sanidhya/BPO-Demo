services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  asterisk:
    build: ./asterisk
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "8089:8089"
      - "10000-10099:10000-10099/udp"
    volumes:
      - ./asterisk/conf/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/conf/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/conf/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/conf/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/conf/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./asterisk/conf/logger.conf:/etc/asterisk/logger.conf:ro
      - ./asterisk/test-audio/real-call-sample.wav:/var/lib/asterisk/sounds/en/real-call-sample.wav:ro
    restart: unless-stopped

  qa-scoring:
    profiles: ["external-ai"]
    build: ./services/qa-scoring
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    restart: unless-stopped

  realtime-assist:
    profiles: ["external-ai"]
    build: ./services/realtime-assist
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ARI_URL: ${ARI_URL}
      ARI_USER: ${ARI_USER}
      ARI_PASSWORD: ${ARI_PASSWORD}
      ARI_APP: ${ARI_APP}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      WS_PORT: ${REALTIME_WS_PORT}
    ports:
      - "${REALTIME_WS_PORT}:${REALTIME_WS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    restart: unless-stopped

  platform-api:
    build: ./services/platform-api
    environment:
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-development}
      PLATFORM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      PLATFORM_SEED_DEMO: ${PLATFORM_SEED_DEMO:-true}
      PLATFORM_SEED_ADMIN_EMAIL: ${PLATFORM_SEED_ADMIN_EMAIL:-admin@pilot.example}
      PLATFORM_SEED_ADMIN_PASSWORD: ${PLATFORM_SEED_ADMIN_PASSWORD}
      PLATFORM_SEED_CHAT_WIDGET_KEY: ${PLATFORM_SEED_CHAT_WIDGET_KEY:-pilot-widget-key-change-me}
      PLATFORM_DEFAULT_AI_MODE: ${PLATFORM_DEFAULT_AI_MODE:-external}
      PLATFORM_CORS_ORIGINS: ${PLATFORM_CORS_ORIGINS:-http://localhost:4173,http://localhost:5173,http://localhost:18081}
      PLATFORM_RECORDING_DIR: /data/recordings
      PLATFORM_VOICE_FIXTURE_PATH: /fixtures/deterministic-pilot.wav
      PLATFORM_VOICE_FIXTURE_MANIFEST_PATH: /fixtures/deterministic-pilot.json
      PLATFORM_GROQ_API_KEY: ${GROQ_API_KEY:-}
      PLATFORM_GROQ_REALTIME_ASR_MODEL: ${GROQ_REALTIME_ASR_MODEL:-whisper-large-v3}
      PLATFORM_GROQ_FINAL_ASR_MODEL: ${GROQ_FINAL_ASR_MODEL:-whisper-large-v3}
      PLATFORM_GROQ_GUIDANCE_MODEL: ${GROQ_GUIDANCE_MODEL:-openai/gpt-oss-20b}
      PLATFORM_GROQ_QA_MODEL: ${GROQ_QA_MODEL:-openai/gpt-oss-20b}
      PLATFORM_USD_TO_INR: ${USD_TO_INR:-84}
    ports:
      - "${PLATFORM_API_PORT:-18080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - recording-data:/data/recordings
      - ./asterisk/test-audio:/fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform-worker:
    build: ./services/platform-api
    command: ["python", "-m", "app.worker"]
    environment:
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-development}
      PLATFORM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      PLATFORM_SEED_DEMO: "false"
      PLATFORM_SEED_ADMIN_PASSWORD: ${PLATFORM_SEED_ADMIN_PASSWORD}
      PLATFORM_SEED_CHAT_WIDGET_KEY: ${PLATFORM_SEED_CHAT_WIDGET_KEY:-pilot-widget-key-change-me}
      PLATFORM_DEFAULT_AI_MODE: ${PLATFORM_DEFAULT_AI_MODE:-external}
      PLATFORM_RECORDING_DIR: /data/recordings
      PLATFORM_VOICE_FIXTURE_PATH: /fixtures/deterministic-pilot.wav
      PLATFORM_VOICE_FIXTURE_MANIFEST_PATH: /fixtures/deterministic-pilot.json
      PLATFORM_GROQ_API_KEY: ${GROQ_API_KEY:-}
      PLATFORM_GROQ_REALTIME_ASR_MODEL: ${GROQ_REALTIME_ASR_MODEL:-whisper-large-v3}
      PLATFORM_GROQ_FINAL_ASR_MODEL: ${GROQ_FINAL_ASR_MODEL:-whisper-large-v3}
      PLATFORM_GROQ_GUIDANCE_MODEL: ${GROQ_GUIDANCE_MODEL:-openai/gpt-oss-20b}
      PLATFORM_GROQ_QA_MODEL: ${GROQ_QA_MODEL:-openai/gpt-oss-20b}
      PLATFORM_USD_TO_INR: ${USD_TO_INR:-84}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - recording-data:/data/recordings
      - ./asterisk/test-audio:/fixtures:ro
    restart: unless-stopped

  console:
    build: ./apps/console
    ports:
      - "${PLATFORM_CONSOLE_PORT:-18081}:80"
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  agent-ui:
    profiles: ["legacy-ui"]
    build: ./services/agent-ui
    ports:
      - "${AGENT_UI_PORT}:80"
    depends_on:
      asterisk:
        condition: service_started
    restart: unless-stopped

  metabase:
    profiles: ["legacy-dashboard"]
    image: metabase/metabase:latest
    ports:
      - "${METABASE_PORT}:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: ${MB_DB_FILE}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  metabase-provision:
    profiles: ["legacy-dashboard"]
    build: ./dashboard/metabase_provision
    environment:
      METABASE_SITE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      - metabase
    restart: "no"

volumes:
  pgdata:
  metabase-data:
  recording-data:
