services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  asterisk:
    build: ./asterisk
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "8089:8089"
      - "10000-10099:10000-10099/udp"
    restart: unless-stopped

  qa-scoring:
    build: ./services/qa-scoring
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    restart: unless-stopped

  realtime-assist:
    build: ./services/realtime-assist
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ARI_URL: ${ARI_URL}
      ARI_USER: ${ARI_USER}
      ARI_PASSWORD: ${ARI_PASSWORD}
      ARI_APP: ${ARI_APP}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      WS_PORT: ${REALTIME_WS_PORT}
    ports:
      - "${REALTIME_WS_PORT}:${REALTIME_WS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    restart: unless-stopped

  agent-ui:
    build: ./services/agent-ui
    ports:
      - "${AGENT_UI_PORT}:80"
    depends_on:
      - realtime-assist
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    ports:
      - "${METABASE_PORT}:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: ${MB_DB_FILE}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  metabase-provision:
    build: ./dashboard/metabase_provision
    environment:
      METABASE_SITE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      - metabase
    restart: "no"

volumes:
  pgdata:
  metabase-data:
