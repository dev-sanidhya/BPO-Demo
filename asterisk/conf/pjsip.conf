; ---------------------------------------------------------------------------
; Transports
; ---------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WebRTC transport for the browser-based agent-ui softphone.
; NOTE: browsers require HTTPS/WSS for getUserMedia outside of localhost.
; This is plain WS for local pilot testing — put a TLS-terminating proxy
; (e.g. nginx/caddy) in front for anything beyond localhost. See README.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; ---------------------------------------------------------------------------
; Extension 1001 — "agent" (WebRTC, used by services/agent-ui)
; ---------------------------------------------------------------------------
[1001]
type=endpoint
context=internal
disallow=all
allow=opus,ulaw
webrtc=yes
transport=transport-wss
auth=1001-auth
aors=1001-aor
direct_media=no

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=changeme1001

[1001-aor]
type=aor
max_contacts=5
remove_existing=yes

; ---------------------------------------------------------------------------
; Extension 1002 — "customer" (plain UDP; used for automated test calls via
; scripts/make_test_call.py and manual softphones like Zoiper/Linphone)
; ---------------------------------------------------------------------------
[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
transport=transport-udp
auth=1002-auth
aors=1002-aor

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=changeme1002

[1002-aor]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
