; ---------------------------------------------------------------------------
; Transports
; ---------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WebRTC transport for the browser-based agent-ui softphone.
; Deliberately protocol=ws, not wss: real wss needs a TLS cert configured
; here, which this pilot config doesn't set up. Browsers only allow
; getUserMedia (microphone access) on secure origins OR localhost — so
; plain ws + accessing agent-ui via http://localhost works fine for
; same-machine testing, but a second physical device on the LAN will need
; a TLS-terminating reverse proxy (nginx/Caddy) in front for both the page
; and this transport. See README "Known tradeoffs".
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

; ---------------------------------------------------------------------------
; Extension 1001 — "agent" (WebRTC, used by services/agent-ui)
;
; NOTE: the AOR section below is deliberately named "1001", not "1001-aor".
; Confirmed live that res_pjsip_registrar resolves an incoming REGISTER's
; AOR by the user part of its Request-URI (e.g. "1001@host") directly
; against a sorcery AOR object of that exact name — not via the endpoint's
; `aors=` line as a name-remapping. A mismatched AOR name (as this
; originally had) fails registration with "AOR '' not found for endpoint",
; even though the endpoint's `aors=` correctly pointed at it. Sorcery
; allows an endpoint/aor/auth trio to share one section name safely, since
; each is a separate object keyed by (type, name) — that's the convention
; used here and in virtually every example pjsip.conf.
; ---------------------------------------------------------------------------
[1001]
type=endpoint
context=internal
disallow=all
allow=opus,ulaw
webrtc=yes
transport=transport-ws
auth=1001-auth
aors=1001
direct_media=no

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=changeme1001

[1001]
type=aor
max_contacts=5
remove_existing=yes

; ---------------------------------------------------------------------------
; Extension 1002 — "customer" (plain UDP; used for automated test calls via
; scripts/make_test_call.py and manual desktop softphones like Zoiper/
; Linphone)
; ---------------------------------------------------------------------------
[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
transport=transport-udp
auth=1002-auth
aors=1002

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=changeme1002

[1002]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

; ---------------------------------------------------------------------------
; Extension 1003 — "customer-browser" (WebRTC, second agent-ui tab) — lets
; a real two-party call be tested entirely in the browser, no desktop
; softphone needed: open agent-ui as ?ext=1001 in one tab and ?ext=1003 in
; another, dial between them, and actually talk.
; ---------------------------------------------------------------------------
[1003]
type=endpoint
context=internal
disallow=all
allow=opus,ulaw
webrtc=yes
transport=transport-ws
auth=1003-auth
aors=1003
direct_media=no

[1003-auth]
type=auth
auth_type=userpass
username=1003
password=changeme1003

[1003]
type=aor
max_contacts=5
remove_existing=yes
