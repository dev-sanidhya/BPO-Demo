[general]
static=yes
writeprotect=no

[globals]

; ---------------------------------------------------------------------------
; internal — real extension-to-extension calling (1001 agent <-> 1002
; customer), used when testing manually with softphones (Zoiper/Linphone) or
; any two live registered endpoints.
;
; Every call is answered, then handed to the realtime-assist ARI app
; (Stasis), which attaches a Snoop + External Media audio tap before
; returning control to the dialplan with continue() so the actual Dial
; proceeds unaffected. This is what lets QA scoring and the real-time
; assist pipeline observe every call without being in the audio path
; itself — and is the only recording/transcription path in this build.
; MixMonitor was tried here first for a separate full-call recording, but
; confirmed live to produce empty (0-frame) files when run alongside the
; Snoop tap on the same channel; rather than debug that conflict, this
; unifies on the Snoop-based pipeline, which reliably captures real audio.
; ---------------------------------------------------------------------------
[internal]
exten => 1001,1,Answer()
 same => n,Stasis(assist_app,agent,${UNIQUEID})
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Answer()
 same => n,Stasis(assist_app,customer,${UNIQUEID})
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

exten => 1003,1,Answer()
 same => n,Stasis(assist_app,customer,${UNIQUEID})
 same => n,Dial(PJSIP/1003,30)
 same => n,Hangup()

; Carrier-free media proof. This reaches the browser customer endpoint without
; requiring the optional legacy ARI listener to be running.
exten => 2003,1,Dial(PJSIP/1003,30)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; autotest — self-contained extension used by scripts/make_test_call.py.
; Originating a channel straight into this extension needs no second party,
; no softphone, and no SIP trunk: Asterisk answers itself, plays bundled
; demo audio (stands in for "customer speech"), and gets tapped by the same
; realtime-assist pipeline as a real call. This is the primary way to prove
; the whole stack end-to-end with zero telephony infrastructure beyond this
; container.
; ---------------------------------------------------------------------------
exten => autotest,1,Answer()
 same => n,Stasis(assist_app,autotest,${UNIQUEID})
 same => n,Playback(demo-congrats)
 same => n,Playback(demo-thanks)
 same => n,Wait(2)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; realcalltest — same self-contained pattern as autotest, but plays a real
; ~2 minute customer service call recording (see test-audio/README.md)
; instead of Asterisk's own generic install-narration demo audio. Used by
; scripts/make_real_call_test.py to prove transcription/QA scoring/nudging
; against genuine call content with actual customer-service dialogue.
; ---------------------------------------------------------------------------
exten => realcalltest,1,Answer()
 same => n,Stasis(assist_app,realcalltest,${UNIQUEID})
 same => n,Playback(real-call-sample)
 same => n,Hangup()

[default]
exten => _X.,1,Goto(internal,${EXTEN},1)
