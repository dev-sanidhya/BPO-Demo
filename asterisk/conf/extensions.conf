[general]
static=yes
writeprotect=no

[globals]

; ---------------------------------------------------------------------------
; internal — real extension-to-extension calling (1001 agent <-> 1002
; customer), used when testing manually with softphones (Zoiper/Linphone) or
; any two live registered endpoints.
;
; Every call is answered, recorded via MixMonitor, then handed to the
; realtime-assist ARI app (Stasis) which attaches an audio tap (ARI External
; Media) before returning control to the dialplan with continueInDialplan()
; so the actual Dial proceeds unaffected. This is what lets QA scoring and
; the real-time assist pipeline observe every call without being in the
; audio path itself.
; ---------------------------------------------------------------------------
[internal]
exten => 1001,1,Answer()
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,Stasis(assist_app,agent,${UNIQUEID})
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Answer()
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,Stasis(assist_app,customer,${UNIQUEID})
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; autotest — self-contained extension used by scripts/make_test_call.py.
; Originating a channel straight into this extension needs no second party,
; no softphone, and no SIP trunk: Asterisk answers itself, plays a bundled
; demo audio file (stands in for "customer speech"), gets recorded, and gets
; tapped by the same realtime-assist pipeline as a real call. This is the
; primary way to prove the whole stack end-to-end with zero telephony
; infrastructure beyond this container.
; ---------------------------------------------------------------------------
exten => autotest,1,Answer()
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,Stasis(assist_app,autotest,${UNIQUEID})
 same => n,Playback(demo-congrats)
 same => n,Playback(demo-thanks)
 same => n,Wait(2)
 same => n,Hangup()

[default]
exten => _X.,1,Goto(internal,${EXTEN},1)
