# This is a low-traffic pilot console, not a CDN-served production site —
# correctness (always serving the latest build) matters far more than
# micro-optimizing cache hits. Without this, browsers can silently keep
# serving a stale app.js/index.html/vendor bundle after a rebuild, which is
# exactly the kind of "why isn't my fix showing up" confusion this avoids.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }
}
